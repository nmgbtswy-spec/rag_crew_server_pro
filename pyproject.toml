[project]
name = "rag-crew-demo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "crewai>=0.193.2",
    "crewai-tools[mcp]>=0.76.0",
    "httpx>=0.28.1",
    "langchain-text-splitters>=1.1.3",
    "mcp[cli]>=1.28,<2",
    "meta>=1.0.2",
    "modelscope>=1.40.2",
    "ollama>=0.6.3",
    "pymupdf>=1.28.2",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.66.0",
]

[project.scripts]
rag-crew-demo = "rag_crew_demo:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
